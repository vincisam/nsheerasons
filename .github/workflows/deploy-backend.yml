name: Deploy Rates Proxy to Railway

on:
  push:
    branches: [ "main" ]
    paths:
      - "rates-proxy/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn -q -DskipTests package
        working-directory: rates-proxy

      - name: Deploy to Railway via CLI
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          METALS_API_KEY: ${{ secrets.METALS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_URL }}
        run: |
          npm install -g @railway/cli
          railway link --project ${{ secrets.RAILWAY_PROJECT_ID }}
          railway service connect rates-proxy
          railway variables set METALS_API_KEY="${METALS_API_KEY}" ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY}" FRONTEND_ORIGIN="${FRONTEND_ORIGIN}"
          railway deploy --detach
