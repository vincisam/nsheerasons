name: Deploy Node Backend to Railway

on:
  push:
    branches: [ "main" ]
    paths:
      - "nsheera-backend/**"
      - ".github/workflows/deploy-node-backend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: nsheera-backend

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
        run: |
          npm install -g @railway/cli
          railway link --project ${{ secrets.RAILWAY_PROJECT_ID_BACKEND }}
          railway service connect nsheera-backend
          railway variables set \
            MONGO_URI="${MONGO_URI}" \
            JWT_SECRET="${JWT_SECRET}" \
            GEMINI_API_KEY="${GEMINI_API_KEY}" \
            ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY}" \
            RAZORPAY_KEY_ID="${RAZORPAY_KEY_ID}" \
            RAZORPAY_KEY_SECRET="${RAZORPAY_KEY_SECRET}" \
            RAZORPAY_WEBHOOK_SECRET="${RAZORPAY_WEBHOOK_SECRET}" \
            CORS_ORIGIN="${CORS_ORIGIN}" \
            NODE_ENV="production"
          railway deploy --detach
