# The metals.dev API key lives here on the server, never in frontend code.
# Set the METALS_API_KEY environment variable when you deploy — do not commit a
# real key to source control. The fallback value below is only for local testing.
metals.api.key=${METALS_API_KEY:UWY1VV6WCDIKUEG1YNEP476G1YNEP}
rapidapi.key=${RAPIDAPI_KEY:d8e114de90msh9ba12e7d8f15c80p1a06d0jsnf80b27f8a954}

# Restrict this to your actual storefront domain in production, e.g.
# FRONTEND_ORIGIN=https://www.nsheera.example
frontend.allowed-origin=${FRONTEND_ORIGIN:*}

# Powers POST /api/design/generate (AI Design Studio) and POST /api/astro/suggest-stone
# (Astro Stone Advisor). Set the ANTHROPIC_API_KEY environment variable when you
# deploy — get a key from console.anthropic.com. Left blank, both endpoints respond
# 503 and the frontend falls back to its in-artifact-only path where applicable.
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-5}

# Powers the accompanying image on each generated design concept. Get a key from
# platform.openai.com. Left blank, image generation is skipped and the concept
# still returns normally with just text — this is a nice-to-have, never required.
openai.api.key=${OPENAI_API_KEY:}
openai.image.model=${OPENAI_IMAGE_MODEL:gpt-image-1}
openai.image.size=${OPENAI_IMAGE_SIZE:1024x1024}

server.port=${PORT:8080}
